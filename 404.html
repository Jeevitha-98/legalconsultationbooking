
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Verdicta Legal Vault</title>
    <!-- Premium Google Fonts Framework Deployment -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="error-style.css">
</head>
<body>

<main class="error-viewport-container">
    
    <!-- Standard high resolution vector error illustration media frame box -->
    <div class="error-media-box">
        <img src="https://unsplash.com" alt="Encrypted secure data link lost illustration node canvas" class="error-media-img">
    </div>

    <!-- Numerical standard error code marquee line -->
    <div class="error-marquee-code">404</div>

    <h1 class="error-headline-title">Lost <em>Jurisdiction.</em></h1>
    
    <p class="error-description-copy">
        The corporate compliance path or secure directory module path you are seeking is unavailable or has been re-assigned to another vault destination node.
    </p>

    <!-- Symmetrical Action Row Control Buttons (Direct Requirement) -->
    <div class="error-action-buttons-row">
        
        <!-- BUTTON A: Back Action Control (Triggers absolute routing history section redirection) -->
        <button type="button" class="btn-error-action btn-error-back-fill" id="action-trigger-history-back">
            <span class="btn-vector-arrow-icon">&larr;</span>
            <span>Go Back Direct</span>
        </button>

        <!-- BUTTON B: Home Action Control (Routes back to your front landing index home template page) -->
        <a href="index.html" class="btn-error-action btn-error-home-outline">
            <span>Return Home</span>
            <span class="btn-vector-arrow-icon">&rarr;</span>
        </a>
        
    </div>

</main>

<style>
    /* --- High-Performance 404 Error Page Presentation Tokens CSS Framework --- */
:root {
    --navy-obsidian: #090d16;
    --amber-brand: #b45309;
    --amber-hover-dark: #92400e;
    --slate-charcoal: #0f172a;
    --slate-muted: #64748b;
    --border-slate: #e2e8f0;
    --canvas-bg: #ffffff; /* FIXED: Premium Pure Solid White Canvas Backdrop Surface Texture */
}

body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background-color: var(--canvas-bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--slate-charcoal);
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    overflow-x: hidden;
}

.error-viewport-container {
    width: 100%;
    max-width: 600px;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-sizing: border-box;
}

/* --- Graphical Error Illustration Frame Layout Block --- */
.error-media-box {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1.2 / 1;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid var(--border-slate);
    background-color: var(--canvas-bg);
}

.error-media-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(0.05) contrast(1.02);
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.error-media-box:hover .error-media-img {
    transform: scale(1.04);
}

/* Typography Heading Matrices Set */
.error-marquee-code {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(4rem, 12vw, 6.5rem);
    font-weight: 700;
    color: var(--navy-obsidian);
    line-height: 1;
    margin: 0 0 10px 0;
    letter-spacing: -2px;
}

.error-headline-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    font-weight: 400;
    color: var(--navy-obsidian);
    line-height: 1.2;
    margin: 0 0 16px 0;
}

.error-headline-title em {
    font-style: italic;
    font-weight: 700;
    color: var(--amber-brand);
}

.error-description-copy {
    font-size: 0.98rem;
    color: var(--slate-muted);
    line-height: 1.6;
    margin: 0 0 36px 0;
    max-width: 440px;
}

/* --- Symmetrical Action Row Control Buttons --- */
.error-action-buttons-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
    flex-wrap: wrap;
}

.btn-error-action {
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 100px; /* Capsule geometric profile button shape precisely mapping screenshot buttons */
    box-sizing: border-box;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    min-width: 180px;
}

/* Back Action Control Button (Direct Requirement) */
.btn-error-back-fill {
    background-color: var(--navy-obsidian);
    border: 1px solid var(--navy-obsidian);
    color: #ffffff !important;
    box-shadow: 0 4px 12px rgba(9, 13, 22, 0.15);
}

.btn-error-back-fill:hover {
    background-color: var(--amber-brand);
    border-color: var(--amber-brand);
    transform: translateY(-3px); /* High fidelity vertical interactive lift loops */
    box-shadow: 0 10px 22px rgba(180, 83, 9, 0.3);
}

/* Home Action Control Button (Direct Requirement) */
.btn-error-home-outline {
    background-color: #ffffff;
    border: 1px solid var(--border-slate);
    color: var(--navy-obsidian) !important;
}

.btn-error-home-outline:hover {
    border-color: var(--amber-brand);
    color: var(--amber-brand) !important;
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(9, 13, 22, 0.02);
}

.btn-vector-arrow-icon {
    font-size: 1.1rem;
    line-height: 1;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-error-back-fill:hover .btn-vector-arrow-icon {
    transform: translateX(-4px); /* Pushes arrows leftward on backward returns hovers */
}

.btn-error-home-outline:hover .btn-vector-arrow-icon {
    transform: translateX(4px); /* Pushes arrows rightward on forward home navigation hovers */
}

/* --- FULLY RESPONSIVE BREAKPOINTS MATRIX --- */
@media (max-width: 480px) {
    .error-viewport-container {
        padding: 24px 16px;
    }

    .error-media-box {
        max-width: 240px;
        margin-bottom: 24px;
    }

    .error-action-buttons-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
    }

    .btn-error-action {
        width: 100%; /* Expands buttons to full width on mobile view glass screens */
    }
}

</style>

<script>
    /**
 * Verdicta Portal Encryption & Error Routing Lifecycle Management Engine
 */
document.addEventListener("DOMContentLoaded", () => {
    const historyBackActionBtn = document.getElementById("action-trigger-history-back");

    if (historyBackActionBtn) {
        historyBackActionBtn.addEventListener("click", (e) => {
            e.preventDefault();

            // FIXED SECTION HEIGHT ROUTING ENGINE (Direct Requirement)
            // Accesses the document referrer ledger parameters to identify the precise page history coordinates
            if (document.referrer && document.referrer !== window.location.href) {
                
                // Routes user explicitly back onto their pre-existing layout lane including exact sub-section hashes (#)
                window.location.href = document.referrer;
                
            } else {
                // Secondary core internal fallback pipeline: drives user exactly 1 historical cycle step backward
                window.history.back();
            }
        });
    }
});

</script>
</body>
</html>
